function txLines(t){
  const a=t.acct==='bank'?'1200':'1100',P=t.partyId||null,m=r2(t.amount);
  const D=(acc,p)=>({acc,dr:m,cr:0,party:p||null}),C=(acc,p)=>({acc,dr:0,cr:m,party:p||null});
  switch(t.cat){
   case'sale':return[D(a),C('4100')];
   case'interest':return[D(a),C(t.acct==='bank'?'4500':'4200')];
   case'service':return[D(a),C('4300')];
   case'inc_other':case'grant':return[D(a),C('4400')];
   case'share':return[D(a),C('3100',P)];
   case'collect_debtor':return[D(a),C('1300',P)];
   case'loan_in':return[D(a),C(t.ctype||'2200',P)];
   case'dep':return[D('1200'),C('1100')];
   case'wd':return[D('1100'),C('1200')];
   case'buy_raw':return[D('5100'),C(a)];
   case'prod_exp':return[D('5120'),C(a)];
   case'buy_goods':return[D('5200'),C(a)];
   case'buy_exp':return[D('5210'),C(a)];
   case'freight_in':return[D('5110'),C(a)];
   case'int_exp':return[D('5300',P),C(a)];
   case'svc_other':return[D('5310'),C(a)];
   case'share_ret':return[D('3100',P),C(a)];
   case'opex':case'other_exp':return[D('5400'),C(a)];
   case'pay_creditor':return[D(t.ctype||'2100',P),C(a)];
   case'lend':return[D('1300',P),C(a)];
   case'buy_asset':return[D('1600'),C(a)];
   case'credit_sale':return[D('1300',P),C('4100')];
   case'credit_buy_goods':return[D('5200'),C('2100',P)];
   case'credit_buy_raw':return[D('5100'),C('2100',P)];
   case'open_cash':return[D('1100'),C('3200')];
   case'open_bank':return[D('1200'),C('3200')];
   case'open_debtor':return[D('1300',P),C('3200')];
   case'open_creditor':return[D('3200'),C(t.ctype||'2100',P)];
   case'open_goods':return[D('1400'),C('3200')];
   case'open_raw':return[D('1500'),C('3200')];
   case'open_share':return[D('3200'),C('3100',P)];
   case'open_asset':{const ac=r2(t.accum||0),L=[D('1600')];if(ac>0)L.push({acc:'1650',dr:0,cr:ac,party:null});L.push({acc:'3200',dr:0,cr:r2(m-ac),party:null});return L}
   case'dispose_asset':{
    const as=assetList().find(x=>x.id===t.assetId);if(!as)return[];
    const c=disposeCalcFor(as,t.date,m),L=[];
    if(m>0)L.push({acc:a,dr:m,cr:0,party:null});
    if(c.prior>0)L.push({acc:'1650',dr:c.prior,cr:0,party:null});
    if(c.fin>0)L.push({acc:'5410',dr:c.fin,cr:0,party:null});
    if(c.loss>0)L.push({acc:'5420',dr:c.loss,cr:0,party:null});
    L.push({acc:'1600',dr:0,cr:as.cost,party:null});
    if(c.gain>0)L.push({acc:'4400',dr:0,cr:c.gain,party:null});
    return L}
   case'journal':return t.dr&&t.cr?[D(t.dr),C(t.cr)]:[];
  }
  return[];
}
function moves(t){
  if(t.lines)return t.lines.filter(l=>l.itemId&&+l.qty>0).map(l=>({itemId:l.itemId,qty:+l.qty,amount:r2(l.amount||0)}));
  return t.itemId&&+t.qty>0?[{itemId:t.itemId,qty:+t.qty,amount:r2(t.amount||0)}]:[];
}
function txDesc(t,onlyIdx){
  let s=t.desc||CD[t.cat].t;
  if(t.partyId&&!t.desc)s+=' - '+pname(t.partyId);
  else if(t.partyId)s+=' ('+pname(t.partyId)+')';
  if(t.cat==='dispose_asset'&&!t.desc){const as=S.tx.find(x=>x.id===t.assetId);if(as)s+=' - '+(as.desc||'สินทรัพย์')}
  const parts=moves(t).filter((m,i)=>onlyIdx==null||i===onlyIdx).map(m=>{const it=iget(m.itemId);return it?it.name+' '+fq(m.qty)+' '+it.unit:''}).filter(Boolean);
  if(t.lines&&t.cat==='prod_exp'&&!parts.length){const ds=t.lines.map(l=>l.desc).filter(Boolean);if(ds.length)s+=' ['+ds.join(', ')+']'}
  if(parts.length)s+=' ['+parts.join(', ')+']';
  return s;
}

function assetList(){
  const dsp={};S.tx.forEach(t=>{if(t.cat==='dispose_asset'&&t.assetId)dsp[t.assetId]={date:t.date,id:t.id}});
  return S.tx.filter(t=>t.cat==='buy_asset'||t.cat==='open_asset').map(t=>({id:t.id,name:t.desc||'สินทรัพย์',cost:r2(t.amount),life:+t.life||5,date:t.date,
    pcs:+t.pcs||1,salvage:r2(t.salvage||0),disp:dsp[t.id]?dsp[t.id].date:null,dispId:dsp[t.id]?dsp[t.id].id:null,
    acq:t.cat==='open_asset'?(t.acqDate||t.date):t.date,accum:t.cat==='open_asset'?r2(t.accum||0):0,open:t.cat==='open_asset'}));
}
/* ค่าเสื่อมราคาเส้นตรง: (ราคาทุน - มูลค่าซาก) / อายุ ปีที่ได้มาและปีที่จำหน่ายคิดตามจำนวนเดือน (นับเดือนที่ได้มา/จำหน่ายเต็มเดือน) */
function depSchedule(a,lastY){
  const out=[];let acc=a.accum;const y0=+a.date.slice(0,4),base=r2(a.cost-(a.salvage||0));
  const dy=a.disp?+a.disp.slice(0,4):null,dm=a.disp?+a.disp.slice(5,7):12;
  const endY=dy!==null?Math.min(lastY,dy):lastY;
  for(let y=y0;y<=endY;y++){
    const m0=(!a.open&&y===y0)?+a.date.slice(5,7):1,m1=(dy!==null&&y===dy)?dm:12,months=Math.max(0,m1-m0+1);
    const rem=r2(base-acc);if(rem<=0.004)break;
    const d=Math.min(rem,r2(base/a.life*months/12));if(d<=0)continue;
    out.push({y,amt:d,disp:dy!==null&&y===dy});acc=r2(acc+d);
  }
  return out;
}
/* คำนวณตัดบัญชีเมื่อจำหน่ายสินทรัพย์: prior=ค่าเสื่อมสะสมถึงสิ้นปีก่อน, fin=ค่าเสื่อมช่วงปีที่จำหน่าย, bv=มูลค่าตามบัญชี */
function disposeCalcFor(a,date,proceeds){
  const dy=+date.slice(0,4),sc=depSchedule(Object.assign({},a,{disp:date}),dy);
  const prior=r2(a.accum+sc.filter(s=>s.y<dy).reduce((s,x)=>s+x.amt,0)),fin=r2(sc.filter(s=>s.y===dy).reduce((s,x)=>s+x.amt,0));
  const bv=r2(a.cost-prior-fin),diff=r2((+proceeds||0)-bv);
  return{prior,fin,bv,gain:diff>0?diff:0,loss:diff<0?-diff:0};
}
function maxYear(){let y=Math.max(thisYear(),S.ui.year||0);for(const t of S.tx)y=Math.max(y,+t.date.slice(0,4));return y}

const cmp=(a,b)=>a.date<b.date?-1:a.date>b.date?1:a.n-b.n;
function E(){
  if(_E)return _E;
  const out=[];
  S.tx.forEach((t,i)=>{const lines=txLines(t);if(lines.length)out.push({id:t.id,date:t.date,n:t.n||i,src:srcOf(t),tx:t,desc:txDesc(t),lines,open:isOpenCat(t.cat)})});
  const ly=maxYear();
  assetList().forEach(a=>depSchedule(a,ly).filter(d=>!d.disp).forEach(d=>out.push({id:'dep'+a.id+d.y,date:d.y+'-12-31',n:1e9,src:'adj',tx:null,desc:'ค่าเสื่อมราคา '+a.name+' ปี '+(d.y+543),
    lines:[{acc:'5410',dr:d.amt,cr:0},{acc:'1650',dr:0,cr:d.amt}]})));
  out.sort(cmp);
  Object.keys(S.closing).sort().forEach(ys=>{
    const c=S.closing[ys],y=+ys,st=ys+'-01-01',en=ys+'-12-31';
    const bal=acc=>{let s=0;for(const e of out)if(e.date<st||(e.open&&e.date<=en))for(const l of e.lines)if(l.acc===acc)s+=l.dr-l.cr;return r2(s)};
    const add=(open,close,inv,eo,ec,label)=>{
      if(close===''||close==null||isNaN(+close))return;
      const ob=bal(inv),cb=r2(+close);
      if(ob>0)out.push({id:'adj'+ys+eo,date:en,n:1e9+1,src:'adj',tx:null,desc:label+'ต้นงวด ปี '+(y+543),lines:[{acc:eo,dr:ob,cr:0},{acc:inv,dr:0,cr:ob}]});
      if(cb>0)out.push({id:'adj'+ys+ec,date:en,n:1e9+2,src:'adj',tx:null,desc:label+'ปลายงวด ปี '+(y+543),lines:[{acc:inv,dr:cb,cr:0},{acc:ec,dr:0,cr:cb}]});
      out.sort(cmp);
    };
    add(0,c.goods,'1400','5220','5230','ปรับปรุงสินค้าคงเหลือ');
    add(0,c.material,'1500','5130','5140','ปรับปรุงวัตถุดิบคงเหลือ');
  });
  return _E=out;
}
const MIN='0000-00-00';
const ySt=y=>y+'-01-01',yEn=y=>y+'-12-31';
const mSt=(y,m)=>m?y+'-'+pad(m)+'-01':ySt(y),mEn=(y,m)=>m?y+'-'+pad(m)+'-'+pad(lastDay(y,m)):yEn(y);
function sumAcc(acc,from,to){let d=0,c=0;for(const e of E()){if(e.date<from||e.date>to)continue;for(const l of e.lines)if(l.acc===acc){d+=l.dr;c+=l.cr}}return{d:r2(d),c:r2(c)}}
function nat(acc,from,to){const{d,c}=sumAcc(acc,from,to);return ACC[acc].s==='dr'?r2(d-c):r2(c-d)}
function priorProfit(y){let s=0;for(const e of E()){if(e.date>=ySt(y))break;for(const l of e.lines){const t=ACC[l.acc].t;if(t==='R'||t==='X')s+=l.cr-l.dr}}return r2(s)}
/* ยอดยกมาของเงินสด/ธนาคารที่ต้นช่วง (นับยอดยกมาที่ลงในช่วงนั้นด้วย) */
function carried(acc,st,en){let s=0;for(const e of E()){if(e.date<st||(e.open&&e.date>=st&&e.date<=en))for(const l of e.lines)if(l.acc===acc)s+=l.dr-l.cr}return r2(s)}

function bookDataR(acct,st,en){
  const ac=acct==='bank'?'1200':'1100';
  const recv=[],pay=[];
  for(const e of E()){
    if(!e.tx||e.open||e.date<st||e.date>en)continue;const t=e.tx;let side=null,col=null;
    if(t.kind==='xfer'){col='XF';side=(t.cat==='dep')===(acct==='bank')?'in':'out'}
    else if(t.acct===acct){side=t.kind;col=OTHER_IN.includes(t.cat)||OTHER_OUT.includes(t.cat)?'OT':t.cat}
    else continue;
    (side==='in'?recv:pay).push({t,col,amt:r2(t.amount),date:t.date});
  }
  const cin=carried(ac,st,en),tr=r2(recv.reduce((s,r)=>s+r.amt,0)),tp=r2(pay.reduce((s,r)=>s+r.amt,0));
  return{recv,pay,carry:cin,tr,tp,end:r2(cin+tr-tp)};
}

/* ---------- ทะเบียนคุมสินค้า/วัตถุดิบ ---------- */
const INC=['buy_goods','buy_raw','credit_buy_goods','credit_buy_raw','stock_in','open_goods','open_raw','prod_exp'];
const OUTC=['sale','credit_sale','stock_out'];
function stockCard(itemId,upTo){
  const mv=[];
  for(const t of S.tx){
    if(!(INC.includes(t.cat)||OUTC.includes(t.cat)))continue;
    if(upTo&&t.date>upTo)continue;
    moves(t).forEach((m,i)=>{if(m.itemId===itemId)mv.push({t,m,i})});
  }
  mv.sort((x,y)=>cmp2(x.t,y.t));
  let bq=0,ba=0,last=0;const rows=[];
  for(const {t,m,i} of mv){
    const q=m.qty,desc=txDesc(t,i);
    if(INC.includes(t.cat)){const a=m.amount,p=q?a/q:0;bq+=q;ba+=a;last=p;rows.push({t,date:t.date,desc,iq:q,ip:p,ia:a,bq,ba,bp:bq?ba/bq:last})}
    else{const p=bq>0?ba/bq:last,a=r2(q*p);bq-=q;ba=bq>0?ba-a:0;rows.push({t,date:t.date,desc,oq:q,op:p,oa:a,bq,ba,bp:bq>0?ba/bq:p})}
  }
  return{rows,bq,ba};
}
function cmp2(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.n||0)-(b.n||0)}

/* ---------- บัญชีย่อย (สมาชิก ลูกหนี้ เจ้าหนี้) ---------- */
function partyCard(p){
  const rows=[];let bal=0;
  for(const e of E()){
    for(const l of e.lines){
      if(l.party!==p.id)continue;
      if(p.type==='member'&&l.acc==='3100'){const inc=l.cr-l.dr;bal+=inc;rows.push({date:e.date,desc:e.desc,inc:inc>0?inc:0,dec:inc<0?-inc:0,int:0,bal,t:e.tx})}
      else if(p.type==='debtor'&&l.acc==='1300'){const inc=l.dr-l.cr;bal+=inc;rows.push({date:e.date,desc:e.desc,inc:inc>0?inc:0,dec:inc<0?-inc:0,int:0,bal,t:e.tx})}
      else if(p.type==='creditor'&&['2100','2200','2300','2400'].includes(l.acc)){const inc=l.cr-l.dr;bal+=inc;rows.push({date:e.date,desc:e.desc+' ['+ACC[l.acc].n+']',inc:inc>0?inc:0,dec:inc<0?-inc:0,int:0,bal,t:e.tx})}
      else if(p.type==='creditor'&&l.acc==='5300'){rows.push({date:e.date,desc:e.desc,inc:0,dec:0,int:l.dr,bal,t:e.tx})}
    }
  }
  return{rows,bal:r2(bal)};
}

/* ---------- งบการเงิน ---------- */
function incomeStmt(y){return incomeStmtR(ySt(y),yEn(y))}
function incomeStmtR(f,t){
  const g=a=>nat(a,f,t);
  const rev=[['4100'],['4200'],['4300'],['4400'],['4500']].map(([a])=>[ACC[a].n,g(a)]);
  const totRev=r2(rev.reduce((s,r)=>s+r[1],0));
  const rawOpen=g('5130'),rawBuy=g('5100'),rawClose=g('5140'),rawUsed=r2(rawOpen+rawBuy-rawClose),freightIn=g('5110'),prodExp=g('5120'),prod=r2(rawUsed+freightIn+prodExp);
  const gOpen=g('5220'),gBuy=g('5200'),gExp=g('5210'),gClose=g('5230'),cogs=r2(gOpen+gBuy+gExp-gClose);
  const int=g('5300'),svo=g('5310'),svc=r2(int+svo),cost=r2(prod+cogs+svc);
  const opx=g('5400'),dep=g('5410'),loss=g('5420'),opex=r2(opx+dep+loss),totExp=r2(cost+opex);
  return{rev,totRev,rawOpen,rawBuy,rawClose,rawUsed,freightIn,prodExp,prod,gOpen,gBuy,gExp,gClose,cogs,int,svo,svc,cost,opx,dep,loss,opex,totExp,profit:r2(totRev-totExp)};
}
function balanceSheet(y){return balanceSheetAt(yEn(y))}
function balanceSheetAt(en){
  const y=+en.slice(0,4),g=a=>nat(a,MIN,en),pp=priorProfit(y),is=incomeStmtR(ySt(y),en);
  const A=['1100','1200','1300','1400','1500'].map(a=>[ACC[a].n,g(a)]);
  const cost=g('1600'),acc=g('1650'),net=r2(cost-acc);
  const totA=r2(A.reduce((s,r)=>s+r[1],0)+net);
  const Ls=['2100','2200','2300','2400'].map(a=>[ACC[a].n,g(a)]),totL=r2(Ls.reduce((s,r)=>s+r[1],0));
  const sh=g('3100'),ret=r2(g('3200')+pp),cur=is.profit,totE=r2(sh+ret+cur);
  return{A,cost,acc,net,totA,Ls,totL,sh,ret,cur,totE,tot:r2(totL+totE),ok:Math.abs(totA-r2(totL+totE))<0.01};
}
function trialBalance(y,m){return trialAt(mEn(y,m))}
function trialAt(en){
  const y=+en.slice(0,4),st=ySt(y),rows=[];
  for(const a of ACCS){
    const s=isBS(a)?sumAcc(a,MIN,en):sumAcc(a,st,en),net=r2(s.d-s.c);
    if(s.d===0&&s.c===0)continue;rows.push({a,n:ACC[a].n,dr:net>0?net:0,cr:net<0?-net:0});
  }
  const pp=priorProfit(y);if(Math.abs(pp)>0.004)rows.push({a:'3300',n:'กำไร(ขาดทุน)สะสมปีก่อน',dr:pp<0?-pp:0,cr:pp>0?pp:0});
  rows.sort((a,b)=>a.a<b.a?-1:1);
  const td=r2(rows.reduce((s,r)=>s+r.dr,0)),tc=r2(rows.reduce((s,r)=>s+r.cr,0));
  return{rows,td,tc};
}
function ledgerData(a,y,m){return ledgerR(a,mSt(y,m),mEn(y,m))}
function ledgerR(a,st,en){
  const from=isBS(a)?MIN:ySt(+st.slice(0,4));
  let cd=0,cc=0;for(const e of E()){if(e.date>=from&&e.date<st)for(const l of e.lines)if(l.acc===a){cd+=l.dr;cc+=l.cr}}
  const rows=[];
  for(const e of E()){if(e.date<st||e.date>en)continue;for(const l of e.lines)if(l.acc===a)rows.push({date:e.date,desc:e.desc,dr:l.dr,cr:l.cr,t:e.tx})}
  return{cd:r2(cd),cc:r2(cc),rows};
}

  <div class="card"><h2>ยินดีต้อนรับกลับมา</h2><p class="sub">กรอกรหัสผ่านที่ตั้งไว้เพื่อเปิดสมุดบัญชีของกลุ่มนี้</p>
  <div class="field"><label for="login_pass">รหัสผ่าน</label><input type="password" id="login_pass" autocomplete="current-password" placeholder="กรอกรหัสผ่าน"></div>
  <div id="login_err" class="err" style="margin-top:10px"></div>
  <p class="hint" style="margin-top:12px">ระบบนี้ล็อกการเข้าใช้งานในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่ใช่ระบบบัญชีออนไลน์ที่ป้องกันการเข้าถึงไฟล์หรือข้อมูลจากผู้เชี่ยวชาญ</p></div>`,bar:`<button class="btn block" data-a="loginIn">เข้าสู่ระบบ</button>`});
SCR.shareSetup=()=>({title:'ลงชื่อหุ้นส่วน',sub:'หน้าเสริม · ข้ามได้',html:`
  <p class="sub">เพิ่มรายชื่อหุ้นส่วน/สมาชิกได้หลายคนในหน้านี้ ข้อมูลนี้ใช้เก็บทะเบียนสมาชิกเบื้องต้น ไม่ได้บันทึกรับเงินค่าหุ้นเข้าบัญชีให้อัตโนมัติ หากรับเงินจริงให้ลงรายการ “รับค่าหุ้น” แยกต่างหาก</p>
  <div id="shareRows" class="sect">
    ${[0,1].map(i=>shareRowHTML(i)).join('')}
  </div>
  <button class="btn ghost" type="button" data-a="addShareRow">+ เพิ่มชื่อหุ้นส่วน</button>
  <div class="card"><p class="hint">ช่องเลขบัตรประชาชนและที่อยู่เป็นข้อมูลส่วนบุคคล ให้กรอกเท่าที่จำเป็นและเก็บอุปกรณ์ให้ปลอดภัย</p></div>`,bar:`<button class="btn block" data-a="saveShareSetup">บันทึกและเริ่มใช้งาน</button><button class="btn ghost block" data-a="skipShareSetup">ข้ามขั้นตอนนี้</button>`});
function shareRowHTML(i){return `<div class="card form two share-row" data-index="${i}">
  <div class="field"><label>ชื่อ-นามสกุลหุ้นส่วน</label><input type="text" class="sh_name" placeholder="ชื่อและนามสกุล"></div>
  <div class="field"><label>เลขทะเบียน/รหัสสมาชิก</label><input type="text" class="sh_no" placeholder="ถ้ามี"></div>
  <div class="field"><label>จำนวนเงินหุ้น (บาท)</label><input type="number" class="sh_amount" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
  <div class="field"><label>เบอร์โทรศัพท์</label><input type="text" class="sh_phone" inputmode="tel" placeholder="ไม่บังคับ"></div>
  <div class="field full"><label>ที่อยู่</label><input type="text" class="sh_addr" placeholder="ไม่บังคับ"></div>
  <div class="field full"><label>เลขบัตรประชาชน (ไม่บังคับ)</label><input type="text" class="sh_idc" inputmode="numeric" placeholder="กรอกเฉพาะเมื่อจำเป็น"></div>
  <div class="field full"><button type="button" class="btn danger sm" data-a="removeShareRow">ลบแถวนี้</button></div>
</div>`}

/* ---------- เมนูหลัก ---------- */

  return{title:S.org.name||'สมุดบัญชี',sub:'พ.ศ. '+(y+543),year:true,html:`
  ${demoBanner()}
  <div><h2 style="margin-bottom:4px">วันนี้มีรายการอะไร</h2><p class="sub">เลือกประเภทรายการ แล้วกรอกตามขั้นตอน</p></div>
  <div class="hero">
   <button class="tile in" data-a="go" data-s="menuAcct" data-p="${jp({k:'in'})}"><span class="ic">${IC.in}</span><span><span class="tt">รับ</span><span class="hh" style="display:block">มีเงินเข้า เช่น ขายของ รับค่าหุ้น รับดอกเบี้ย</span></span></button>
   <button class="tile out" data-a="go" data-s="menuAcct" data-p="${jp({k:'out'})}"><span class="ic">${IC.out}</span><span><span class="tt">จ่าย</span><span class="hh" style="display:block">มีเงินออก เช่น ซื้อวัตถุดิบ ค่าแรง ค่าใช้จ่าย</span></span></button>
   <button class="tile gen" data-a="go" data-s="gen"><span class="ic">${IC.doc}</span><span><span class="tt">ทั่วไป</span><span class="hh" style="display:block">ยังไม่มีเงินเข้าออก เช่น ขายเชื่อ ซื้อเชื่อ ยอดยกมา ปิดงวด</span></span></button>
  </div>
  <div class="kpis">
   <div class="kpi"><div class="k">เงินสดคงเหลือ</div><div class="v">${esc(fmt(cash,'0.00'))}</div></div>
   <div class="kpi"><div class="k">เงินฝากธนาคาร</div><div class="v">${esc(fmt(bank,'0.00'))}</div></div>
   <div class="kpi"><div class="k">กำไร (ขาดทุน) ปี ${y+543}</div><div class="v ${pr<0?'neg':''}">${esc(fmt(pr,'0.00'))}</div></div>
  </div>
  <div class="grid">
   ${goT('reports',{},'ดูสมุด บัญชี ทะเบียน และงบการเงิน','ทุกอย่างคำนวณให้อัตโนมัติ','',IC.book)}
   ${goT('settings',{},'ข้อมูลกลุ่ม สำรองข้อมูล ส่งออก Excel','','',IC.gear)}
  </div>`};
};
SCR.menuAcct=p=>{
  const k=p.k,en=yEn(S.ui.year),cash=nat('1100',MIN,en),bank=nat('1200',MIN,en);
  return{title:k==='in'?'รับเงิน':'จ่ายเงิน',sub:'เงินเข้า-ออกทางไหน',html:`
  <div><h2>${k==='in'?'รับเงินเข้าทางไหน':'จ่ายเงินออกจากทางไหน'}</h2></div>
  <div class="grid big">
   ${goT('cats',{k,acct:'cash'},'เงินสด','บันทึกลงสมุดเงินสด · คงเหลือ '+fmt(cash,'0.00')+' บาท',k,IC.cash)}
   ${goT('cats',{k,acct:'bank'},'เงินฝากธนาคาร','บันทึกลงสมุดเงินฝากธนาคาร · คงเหลือ '+fmt(bank,'0.00')+' บาท',k,IC.bank)}
  </div>`};
};
const goT=(s,p,title,hint,cls,icon)=>`<button class="tile ${cls||''}" data-a="go" data-s="${s}" data-p="${jp(p)}"><span class="ic">${icon||IC.doc}</span><span style="flex:1;min-width:0"><span class="tt">${esc(title)}</span>${hint?`<span class="hh" style="display:block">${esc(hint)}</span>`:''}</span>${IC.chev}</button>`;
function xfLabel(cat,acct){
  if(acct==='cash')return cat==='wd'?'ถอนเงินฝากธนาคาร':'นำเงินสดฝากธนาคาร';
  return cat==='dep'?'รับนำฝาก (นำเงินสดมาฝาก)':'ถอนเงินจากบัญชี';
}
const xfCat=(k,acct)=>(k==='in')===(acct==='cash')?'wd':'dep';
SCR.cats=p=>{
  const{k,acct}=p,bk=acct==='cash'?'เงินสด':'เงินฝากธนาคาร';
  const G=k==='in'?[['รายได้',['sale','interest','service','inc_other']],['เงินทุนและรายการอื่น',['share','XF','OT']]]
    :[['ต้นทุนการผลิต',['buy_raw','freight_in','prod_exp']],['ต้นทุนขาย',['buy_goods','buy_exp']],['ต้นทุนบริการ',['int_exp','svc_other']],['อื่นๆ',['share_ret','XF','opex','OT']]];
  const t1=c=>{
    if(c==='XF'){const x=xfCat(k,acct);return goT('form',{cat:x,acct},xfLabel(x,acct),'ลงทั้งสมุดเงินสดและสมุดเงินฝากธนาคารให้เอง',k,k==='in'?IC.in:IC.out)}
    if(c==='OT')return goT('others',{k,acct},'อื่นๆ',k==='in'?'รับชำระหนี้ รับเงินกู้ เงินอุดหนุน':'ชำระหนี้ ให้กู้ ซื้อสินทรัพย์ จ่ายอื่นๆ',k,IC.doc);
    return goT('form',{cat:c,acct},CD[c].t,CD[c].h,k,k==='in'?IC.in:IC.out)};
  const recent=S.tx.filter(t=>(t.kind===k&&t.acct===acct)||(t.kind==='xfer'&&(((t.cat==='dep')===(acct==='bank'))===(k==='in')))).sort((a,b)=>cmp2(b,a));
  return{title:(k==='in'?'รับ':'จ่าย')+' · '+bk,sub:'เลือกประเภทรายการ',html:
   G.map(([h,cs])=>`<div class="sect"><h3>${esc(h)}</h3><div class="grid">${cs.map(t1).join('')}</div></div>`).join('')+
   `<div class="sect recent-history"><h3>รายการในสมุดนี้ทั้งหมด (แตะเพื่อแก้ไข)</h3>${recentList(recent,acct)}</div>`};
};
function recentList(list,acct){
  if(!list.length)return'<div class="empty card">ยังไม่มีรายการ</div>';
  return tbl([{t:'วันที่',d:1},{t:'รายการ'},{t:'บาท',n:1}],list.map(t=>({c:[dshort(t.date),txDesc(t),t.amount?+t.amount:''],act:['go',{s:'form',p:{cat:t.cat,acct:t.acct||acct,id:t.id}}]})));
}
SCR.others=p=>{
  const{k,acct}=p,L=k==='in'?OTHER_IN:OTHER_OUT;
  return{title:'อื่นๆ · '+(acct==='cash'?'เงินสด':'เงินฝากธนาคาร'),sub:k==='in'?'รับ':'จ่าย',html:`<div class="grid">${L.map(c=>goT('form',{cat:c,acct},CD[c].t,CD[c].h,k,k==='in'?IC.in:IC.out)).join('')}</div>`};
};
SCR.gen=()=>{
  const L=['credit_sale','credit_buy_goods','credit_buy_raw','stock_in','stock_out'];
  const recent=S.tx.filter(t=>t.kind==='gen'&&!isOpenCat(t.cat)).sort((a,b)=>cmp2(b,a)).slice(0,6);
  return{title:'รายการทั่วไป',sub:'ยังไม่เกี่ยวกับการรับจ่ายเงิน',html:`
  <p class="sub">ใช้บันทึกรายการที่ยังไม่มีเงินเข้าออก เมื่อมีการรับหรือจ่ายเงินจริงค่อยไปบันทึกที่เมนู รับ หรือ จ่าย</p>
  <div class="grid">${L.map(c=>goT('form',{cat:c},CD[c].t,CD[c].h,'gen',IC.doc)).join('')}
  ${goT('form',{cat:'interest',acct:'bank'},'ดอกเบี้ยเงินฝากธนาคาร','ธนาคารจ่ายดอกเบี้ยเข้าบัญชีให้กลุ่ม','gen',IC.bank)}
  ${goT('opens',{},'ยอดยกมา (ตอนเริ่มทำบัญชี)','เงินสด เงินฝาก ลูกหนี้ เจ้าหนี้ สินค้า สินทรัพย์ ค่าหุ้น','gen',IC.book)}
  ${goT('closing',{},'ปิดงวดสิ้นปี','บันทึกสินค้า/วัตถุดิบคงเหลือปลายปี ระบบคิดค่าเสื่อมให้เอง','gen',IC.book)}
  ${goT('form',{cat:'dispose_asset'},CD.dispose_asset.t,CD.dispose_asset.h,'gen',IC.doc)}
  ${goT('form',{cat:'journal'},CD.journal.t,CD.journal.h,'gen',IC.doc)}</div>
  <div class="sect"><h3>รายการทั่วไปล่าสุด (แตะเพื่อแก้ไข)</h3>${recentList(recent,null)}</div>`};
};
SCR.opens=()=>{
  const list=S.tx.filter(t=>isOpenCat(t.cat)).sort(cmp2);
  return{title:'ยอดยกมา',sub:'บันทึกครั้งเดียวตอนเริ่มทำบัญชี',html:`
  <p class="sub">ถ้ากลุ่มเริ่มทำบัญชีใหม่ ให้ลงสิ่งที่มีอยู่แล้วตอนเริ่มต้น ระบบจะคำนวณทุนสะสมให้เอง ถ้าไม่มีอะไรยกมาข้ามได้</p>
  <div class="grid">${OPENS.map(c=>goT('form',{cat:c},CD[c].t,CD[c].h,'gen',IC.book)).join('')}</div>
  <div class="sect"><h3>ยอดยกมาที่บันทึกแล้ว (แตะเพื่อแก้ไข)</h3>${recentList(list,null)}</div>`};
};

/* ---------- ฟอร์มบันทึกรายการ ---------- */
function parseF(s){
  const i=s.indexOf(':'),base=i<0?s:s.slice(0,i),rest=i<0?'':s.slice(i+1);
  const req=base.endsWith('!'),nm=base.replace(/[!?]$/,'');
  if(nm==='party'||nm==='item'){const j=rest.indexOf(':');let ty=j<0?rest:rest.slice(0,j);const opt=ty.endsWith('?'),rq=ty.endsWith('!');ty=ty.replace(/[!?]$/,'');return{nm,ty,req:nm==='party'?!opt:rq}}
  return{nm,req,label:rest};
}
const cat0=p=>p.cat==='dispose_asset';
function formKind(cat,acct){const d=CD[cat];if(cat==='dispose_asset')return acct?'in':'gen';if(d.k==='xfer')return(cat==='dep')===(acct==='bank')?'in':'out';return d.k==='open'||d.k==='gen'?'gen':d.k}
SCR.form=p=>{
  const d=CD[p.cat],acct=p.acct||null,t=p.id?S.tx.find(x=>x.id===p.id):null,kind=formKind(p.cat,acct);
  const v=t||{date:S.ui.lastDate||todayISO()};
  const title=d.k==='xfer'?xfLabel(p.cat,acct):d.t;
  const book=cat0(p)?'ลงสมุดตามวิธีรับเงินที่เลือก':d.k==='xfer'?'ลงสมุดเงินสดและสมุดเงินฝากธนาคาร':d.k==='open'?'ยอดยกมา':d.k==='gen'?'ลงสมุดรายวันทั่วไป':(acct==='cash'?'ลงสมุดเงินสด':'ลงสมุดเงินฝากธนาคาร');
  let h='';
  for(const spec of d.f){
    const f=parseF(spec);
    if(f.nm==='date')h+=`<div class="field"><label for="f_date">วันที่</label><input type="date" id="f_date" value="${esc(v.date)}"></div>`;
    else if(f.nm==='amount'||f.nm==='amount0')h+=`<div class="field"><label for="f_amount">${esc(f.label||'จำนวนเงิน (บาท)')}</label><input type="number" class="amount" id="f_amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${t&&(t.amount||f.nm==='amount0')?esc(t.amount):''}" ${d.f.some(s=>s.startsWith('lines:'))?'readonly':''}></div>`;
    else if(f.nm==='price')h+=`<div class="field"><label for="f_price">${esc(f.label||'ราคาต่อหน่วย (บาท)')}</label><input type="number" id="f_price" inputmode="decimal" step="any" min="0" placeholder="0.00" value="${t&&t.amount&&(+t.qty||+t.pcs)?pround(t.amount/(+t.qty||+t.pcs)):''}"><span class="hint">ใส่จำนวนกับราคาต่อหน่วย ระบบคิดจำนวนเงินให้เอง</span></div>`;
    else if(f.nm==='pcs')h+=`<div class="field"><label for="f_pcs">จำนวนชิ้น</label><input type="number" id="f_pcs" inputmode="numeric" step="1" min="1" value="${t&&t.pcs?esc(t.pcs):1}"></div>`;
    else if(f.nm==='salvage')h+=`<div class="field"><label for="f_salv">มูลค่าซาก (บาท)</label><input type="number" id="f_salv" inputmode="decimal" step="0.01" min="0" value="${t&&t.salvage?esc(t.salvage):0}"><span class="hint">ราคาที่คาดว่าจะขายได้เมื่อเลิกใช้ ค่าเสื่อมคิดจาก (ราคาทุน − มูลค่าซาก) ถ้าไม่มีใส่ 0</span></div>`;
    else if(f.nm==='asset'){
      const L=assetList().filter(x=>!x.dispId||(t&&x.dispId===t.id));
      h+=`<div class="field full"><label for="f_asset">สินทรัพย์ที่จำหน่าย</label><select id="f_asset"><option value="">— เลือก —</option>${L.map(x=>`<option value="${x.id}" ${t&&t.assetId===x.id?'selected':''}>${esc(x.name)}${x.pcs>1?' ('+x.pcs+' ชิ้น)':''} · ราคาทุน ${esc(fmt(x.cost))}</option>`).join('')}</select><div id="dispHint" class="hint"></div>${L.length?'':'<span class="err">ยังไม่มีสินทรัพย์ที่จำหน่ายได้</span>'}</div>`;
    }
    else if(f.nm==='recv')h+=`<div class="field full"><label for="f_recv">รับเงินที่ได้จากการจำหน่ายเข้า</label><select id="f_recv"><option value="cash" ${(t?t.acct:acct||'cash')==='cash'?'selected':''}>เงินสด</option><option value="bank" ${(t?t.acct:acct)==='bank'?'selected':''}>เงินฝากธนาคาร</option><option value="none" ${t&&!t.acct?'selected':''}>ไม่ได้รับเงิน (ทิ้ง ชำรุด ยกให้)</option></select></div>`;
    else if(f.nm==='range')h+=lotHTML(t,v);
    else if(f.nm==='lines'||f.nm==='linesq')h+=`<div class="field full" id="linesBox" data-priced="${f.nm==='lines'?1:0}" data-kind="${esc(f.label)}"><label>${f.nm==='lines'?'รายการในบิล':'รายการวัตถุดิบที่เบิก'}</label><div id="lineRows" class="sect"></div><div><button class="btn ghost sm" data-a="addLine">+ เพิ่มรายการ</button></div></div>`;
    else if(f.nm==='desc')h+=`<div class="field ${f.label?'':'full'}"><label for="f_desc">${esc(f.label||(f.req?'รายละเอียด':'รายละเอียด (ไม่บังคับ)'))}</label><input type="text" id="f_desc" value="${esc(t?t.desc:'')}" placeholder="${f.req?'พิมพ์รายละเอียด':'เช่น ขายให้ป้าแดง ตลาดนัดวันเสาร์'}"></div>`;
    else if(f.nm==='qty')h+=`<div class="field"><label for="f_qty">จำนวน${f.req?'':' (ถ้าระบุสินค้า)'}</label><input type="number" id="f_qty" inputmode="decimal" step="any" min="0" value="${t&&t.qty?esc(t.qty):''}"></div>`;
    else if(f.nm==='party'){
      const L=S.parties.filter(x=>x.type===f.ty),lb={member:'สมาชิก',debtor:'ลูกหนี้',creditor:'เจ้าหนี้'}[f.ty];
      h+=`<div class="field full"><label for="f_party">${lb}${f.req?'':' (ถ้ามี)'}</label><select id="f_party"><option value="">${f.req?'— เลือก —':'— ไม่ระบุ —'}</option>${L.map(x=>`<option value="${x.id}" ${t&&t.partyId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="__new">+ เพิ่ม${lb}ใหม่</option></select>${DEBT[p.cat]?'<div id="debtHint" class="hint" style="margin-top:4px"></div>':''}
      <div id="newParty" hidden class="form two" style="margin-top:6px"><div class="field"><label for="f_pname">ชื่อ-นามสกุล</label><input type="text" id="f_pname"></div>${f.ty==='member'?'<div class="field"><label for="f_pno">เลขทะเบียนสมาชิก</label><input type="text" id="f_pno"></div>':''}<div class="field"><label for="f_paddr">ที่อยู่ (ไม่บังคับ)</label><input type="text" id="f_paddr"></div><div class="field"><label for="f_pid">เลขบัตรประชาชน (ไม่บังคับ)</label><input type="text" id="f_pid" inputmode="numeric"></div></div></div>`;
    }else if(f.nm==='item'){

      <div id="newItem" hidden class="form two" style="margin-top:6px"><div class="field"><label for="f_iname">ชื่อ${lb}</label><input type="text" id="f_iname"></div><div class="field"><label for="f_iunit">หน่วยนับ</label><input type="text" id="f_iunit" placeholder="เช่น กก. ถุง ชิ้น"></div>${f.ty==='goods'?'<div class="field"><label for="f_iprice">ราคาขายต่อหน่วย (ไม่บังคับ)</label><input type="number" id="f_iprice" inputmode="decimal" step="0.01"></div>':''}</div></div>`;
    }else if(f.nm==='ctype')h+=`<div class="field full"><label for="f_ctype">ประเภทหนี้</label><select id="f_ctype">${CTYPES.map(([a,n])=>`<option value="${a}" ${(t?t.ctype:p.cat==='loan_in'?'2200':'2100')===a?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
    else if(f.nm==='sub')h+=`<div class="field full"><label for="f_sub">ประเภทค่าใช้จ่ายในการผลิต</label><select id="f_sub">${SUBS.map(([a,n])=>`<option value="${a}" ${(t&&t.sub||'other')===a?'selected':''}>${esc(n)}</option>`).join('')}</select><span class="hint">ใช้แยกแสดงในรายงานต้นทุนการผลิต</span></div>`;
    else if(f.nm==='life')h+=`<div class="field"><label for="f_life">อายุการใช้งาน (ปี)</label><input type="number" id="f_life" inputmode="numeric" min="1" value="${t&&t.life?esc(t.life):5}"><span class="hint">ระบบคิดค่าเสื่อมราคาแบบเส้นตรงให้เอง</span></div>`;
    else if(f.nm==='accum')h+=`<div class="field"><label for="f_accum">ค่าเสื่อมราคาสะสมที่ผ่านมา (บาท)</label><input type="number" id="f_accum" inputmode="decimal" step="0.01" min="0" value="${t&&t.accum?esc(t.accum):''}"><span class="hint">ถ้าเพิ่งซื้อมา ใส่ 0</span></div>`;
    else if(f.nm==='dr'||f.nm==='cr'){
      const lb=f.nm==='dr'?'เดบิต (ด้านซ้าย) บัญชี':'เครดิต (ด้านขวา) บัญชี';
      h+=`<div class="field"><label for="f_${f.nm}">${lb}</label><select id="f_${f.nm}"><option value="">— เลือก —</option>${ACCS.map(a=>`<option value="${a}" ${t&&t[f.nm]===a?'selected':''}>${a} ${esc(ACC[a].n)}</option>`).join('')}</select></div>`;
    }
  }
  const note=d.k==='xfer'?'รายการนี้จะลงทั้งสมุดเงินสดและสมุดเงินฝากธนาคารให้อัตโนมัติ':'';
  const stockHistory=p.cat==='stock_out'?`<div class="sect recent-history"><h3>ประวัติการเบิกวัตถุดิบ (แตะเพื่อแก้ไข)</h3>${recentList(S.tx.filter(x=>x.cat==='stock_out').sort((a,b)=>cmp2(b,a)),null)}</div>`:'';
  return{title,sub:book,html:`
  <div class="row"><span class="pill ${kind}">${esc(book)}</span>${t?'<span class="pill warn">กำลังแก้ไขรายการเดิม</span>':''}</div>
  <p class="sub" style="margin-top:-8px">${esc(d.h)}${note?'. '+esc(note):''}</p>
  <div class="card form two" id="theForm">${h}<div class="full err" id="f_err" role="alert"></div></div>
  ${t?`<div><button class="btn danger sm" data-a="delTx" data-id="${t.id}">ลบรายการนี้</button></div>`:''}
  ${stockHistory}`,
  bar:`<button class="btn ${kind} block" data-a="saveTx" data-p="${jp(p)}">บันทึกรายการ</button>`,
  after:()=>formAfter(p,t)};
};

/* ============ ส่วนประกอบฟอร์มเสริม (บิลหลายรายการ ต้นทุนล็อต ยอดหนี้ จำหน่ายสินทรัพย์) ============ */
function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function partyBalance(pid,acc,excl){let s=0;for(const e of E()){if(excl&&e.id===excl)continue;for(const l of e.lines)if(l.party===pid&&l.acc===acc)s+=l.dr-l.cr}return r2(ACC[acc].s==='dr'?s:-s)}
function lnKind(){const b=$('#linesBox');return b?{kind:b.dataset.kind,priced:b.dataset.priced==='1'}:null}
function readLn(){
  return[...document.querySelectorAll('#lineRows .lrow')].map(r=>{
    const g=c=>r.querySelector(c),v=c=>g(c)?g(c).value:'',n=c=>{const x=parseFloat(v(c));return isNaN(x)?0:x};
    return{itemId:v('.l_item'),nn:v('.l_nn').trim(),nu:v('.l_nu').trim(),desc:v('.l_desc').trim(),q:n('.l_qty'),p:n('.l_price'),a:n('.l_amt'),qs:v('.l_qty'),ps:v('.l_price'),as:v('.l_amt')};
  });
}
function showStock(i){
  const k=lnKind(),r=document.querySelectorAll('#lineRows .lrow')[i];if(!k||k.priced||!r)return;
  const id=r.querySelector('.l_item').value,it=iget(id),h=r.querySelector('.l_stock');
  if(!it){h.textContent='';return}
  const bq=stockCard(id).bq,q=parseFloat(r.querySelector('.l_qty').value)||0;
  h.innerHTML='คงเหลือในทะเบียน '+esc(fq(bq))+' '+esc(it.unit)+(q>bq+1e-9?' <span class="err">· เบิกมากกว่าที่มีในทะเบียน</span>':'');
}
function sumLines(){
  const k=lnKind(),am=$('#f_amount');if(!k||!k.priced||!am)return;
  am.value=r2(readLn().reduce((s,r)=>s+r.a,0))||'';
}
function drawLines(rows){
  const k=lnKind();if(!k)return;
  const items=S.items.filter(x=>x.kind===k.kind),lb=k.kind==='goods'?'สินค้า':'วัตถุดิบ';
  $('#lineRows').innerHTML=rows.map((l,i)=>`<div class="lrow" data-i="${i}">
   <div class="field full"><label>${lb}รายการที่ ${i+1}</label><select class="l_item" aria-label="${lb}รายการที่ ${i+1}"><option value="">— เลือก${lb} —</option>${items.map(x=>`<option value="${x.id}" ${l.itemId===x.id?'selected':''}>${esc(x.name)} (${esc(x.unit)})</option>`).join('')}<option value="__new" ${l.itemId==='__new'?'selected':''}>+ เพิ่ม${lb}ใหม่</option></select>
    <div class="l_newbox form two" style="margin-top:6px" ${l.itemId==='__new'?'':'hidden'}><div class="field"><label>ชื่อ${lb}</label><input type="text" class="l_nn" value="${esc(l.nn||'')}"></div><div class="field"><label>หน่วยนับ</label><input type="text" class="l_nu" value="${esc(l.nu||'')}" placeholder="เช่น กก. ถุง"></div></div>
    <div class="field full"><label>รายละเอียดรายการ (เช่น ค่าแรง / ค่าภาชนะ)</label><input type="text" class="l_desc" value="${esc(l.desc||'')}" placeholder="ระบุชื่อรายการค่าใช้จ่าย (ไม่บังคับ)"></div><div class="hint l_stock"></div></div>
   <div class="field"><label class="l_qty_label">จำนวน${l.itemId&&iget(l.itemId)?' ('+esc(iget(l.itemId).unit)+')':' (หน่วยนับตามที่เลือก)'}</label><input type="number" class="l_qty" inputmode="decimal" step="any" min="0" value="${esc(l.qs||'')}"></div>
   ${k.priced?`<div class="field"><label>ราคาต่อหน่วย (บาท)</label><input type="number" class="l_price" inputmode="decimal" step="any" min="0" value="${esc(l.ps||'')}"></div><div class="field"><label>เป็นเงิน (บาท)</label><input type="number" class="l_amt" inputmode="decimal" step="0.01" min="0" value="${esc(l.as||'')}"></div>`:''}
   <div class="field" style="justify-content:flex-end">${rows.length>1?`<button type="button" class="btn danger sm" data-a="delLine" data-i="${i}">ลบแถวนี้</button>`:''}</div></div>`).join('');
  rows.forEach((l,i)=>showStock(i));
  sumLines();
}
function initLines(t){
  let rows;
  if(t&&t.lines)rows=t.lines.map(l=>({itemId:l.itemId,desc:l.desc||'',qs:l.qty||'',ps:l.price||'',as:l.amount||''}));
  else if(t&&t.itemId)rows=[{itemId:t.itemId,qs:t.qty||'',ps:t.qty?pround(t.amount/t.qty):'',as:t.amount||''}];
  else if(t&&t.amount)rows=[{itemId:'',qs:'',ps:'',as:t.amount}];
  else rows=[{itemId:'',qs:'',ps:'',as:''}];
  const k=lnKind();if(k.priced&&$('#f_amount'))$('#f_amount').readOnly=true;
  drawLines(rows);
  const box=$('#lineRows');
  box.addEventListener('input',ev=>{
    const r=ev.target.closest('.lrow');if(!r)return;const c=ev.target.classList;
    const q=r.querySelector('.l_qty'),pr=r.querySelector('.l_price'),am=r.querySelector('.l_amt');
    const qv=parseFloat(q.value),pv=pr?parseFloat(pr.value):NaN,av=am?parseFloat(am.value):NaN;
    if(c.contains('l_qty')||c.contains('l_price')){if(am&&qv>0&&pv>=0&&pr.value!=='')am.value=r2(qv*pv);else if(am&&c.contains('l_qty')&&qv>0&&av>0)pr.value=pround(av/qv)}
    else if(c.contains('l_amt')){if(qv>0&&av>0)pr.value=pround(av/qv)}
    sumLines();showStock(+r.dataset.i);
  });
  box.addEventListener('change',ev=>{
    if(!ev.target.classList.contains('l_item'))return;const r=ev.target.closest('.lrow');
    r.querySelector('.l_newbox').hidden=ev.target.value!=='__new';const it=iget(ev.target.value);if(it){const q=r.querySelector('.l_qty_label');if(q)q.textContent='จำนวน ('+it.unit+')';const pr=r.querySelector('.l_price');const am=r.querySelector('.l_amt');if(pr&&!pr.value&&(it.price||it.cost)){pr.value=it.price||it.cost;if(parseFloat(r.querySelector('.l_qty').value)>0)am.value=r2(parseFloat(r.querySelector('.l_qty').value)*parseFloat(pr.value));sumLines()}}showStock(+r.dataset.i);
  });
}
const keepRows=()=>readLn().map(r=>({itemId:r.itemId,nn:r.nn,nu:r.nu,desc:r.desc,qs:r.qs,ps:r.ps,as:r.as}));

/* ต้นทุนล็อตที่ผลิต */
function lotHTML(t,v){
  const prev=S.tx.filter(x=>x.cat==='stock_in'&&x.to&&(!t||x.id!==t.id)).map(x=>x.to).sort().pop();
  const from=t&&t.from||(prev?addDays(prev,1):ySt(+v.date.slice(0,4))),to=t&&t.to||v.date;
  return`<div class="field full"><div class="card" style="background:var(--surface2)"><h3 style="margin-bottom:6px">ต้นทุนของล็อตที่ผลิต</h3><p class="hint" style="margin:0 0 10px">เลือกช่วงวันที่ผลิต ระบบรวมวัตถุดิบที่เบิกใช้ ค่าแรง ค่าขนส่งเข้า และค่าใช้จ่ายการผลิตในช่วงนั้นมาให้</p><div class="form two"><div class="field"><label for="f_from">ผลิตตั้งแต่วันที่</label><input type="date" id="f_from" value="${esc(from)}"></div><div class="field"><label for="f_to">ถึงวันที่</label><input type="date" id="f_to" value="${esc(to)}"></div></div><div id="lotOut" style="margin-top:10px"></div></div></div>`;
}
function lotCost(from,to){
  const raw=[];let rt=0;
  for(const it of S.items.filter(i=>i.kind==='material')){
    let q=0,a=0;for(const r of stockCard(it.id,to).rows)if(r.t.cat==='stock_out'&&r.date>=from&&r.date<=to){q+=r.oq;a+=r.oa}
    if(q>0){raw.push({it,q,a:r2(a)});rt+=a}
  }
  const sum=f=>r2(S.tx.filter(x=>f(x)&&x.date>=from&&x.date<=to).reduce((s,x)=>s+ +x.amount,0));
  const labor=sum(x=>x.cat==='prod_exp'&&x.sub==='labor'),other=sum(x=>x.cat==='prod_exp'&&x.sub!=='labor'),freight=sum(x=>x.cat==='freight_in');
  rt=r2(rt);return{raw,rawT:rt,labor,other,freight,total:r2(rt+labor+other+freight)};
}
const LOT={dirty:false,total:0};
function lotUnit(){
  const h=$('#lotUnit'),q=parseFloat(($('#f_qty')||{}).value),a=parseFloat(($('#f_amount')||{}).value);
  if(h)h.innerHTML=q>0&&a>0?'ต้นทุนต่อหน่วย <b>'+esc(fmt(a/q))+'</b> บาท':'';
}
function renderLot(excl){
  const f=$('#f_from').value,to=$('#f_to').value,out=$('#lotOut');
  if(!f||!to||f>to){out.innerHTML='<span class="err">เลือกช่วงวันที่ให้ถูกต้อง</span>';return}
  const c=lotCost(f,to);LOT.total=c.total;
  const rows=[...c.raw.map(r=>[ 'วัตถุดิบที่เบิกใช้: '+r.it.name+' '+fq(r.q)+' '+r.it.unit,r.a]),['ค่าขนส่งซื้อวัตถุดิบ (ขนส่งขาเข้า)',c.freight],['ค่าแรงงาน',c.labor],['ค่าใช้จ่ายในการผลิตอื่นๆ',c.other]];
  const over=S.tx.filter(x=>x.cat==='stock_in'&&x.from&&x.id!==excl&&x.from<=to&&x.to>=f);
  out.innerHTML=tbl([{t:'รายการต้นทุน'},{t:'บาท',n:1}],rows,['รวมต้นทุนล็อตนี้',c.total])+
   (c.raw.length?'':'<p class="hint">ยังไม่มีการเบิกวัตถุดิบในช่วงนี้ (เมนู ทั่วไป › เบิกวัตถุดิบไปผลิต)</p>')+
   (over.length?`<p class="err">ช่วงวันที่นี้ทับกับล็อตที่บันทึกไว้แล้ว (${esc(dshort(over[0].from))} – ${esc(dshort(over[0].to))}) ต้นทุนอาจนับซ้ำ</p>`:'')+
   `<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-a="fill" data-t="f_amount" data-v="${c.total}">ใช้ต้นทุนนี้เป็นจำนวนเงิน</button><span id="lotUnit" class="hint"></span></div>`;
  if(!LOT.dirty&&c.total>0)$('#f_amount').value=c.total;
  lotUnit();
}
function initLot(t){
  LOT.dirty=!!t;const excl=t&&t.id;
  let toDirty=!!(t&&t.to&&t.to!==t.date);
  const f=$('#f_from'),to=$('#f_to'),dt=$('#f_date'),am=$('#f_amount'),q=$('#f_qty');
  am.addEventListener('input',()=>{LOT.dirty=true;lotUnit()});q.addEventListener('input',lotUnit);
  dt.addEventListener('change',()=>{if(!toDirty){to.value=dt.value;renderLot(excl)}});
  to.addEventListener('change',()=>{toDirty=true;renderLot(excl)});f.addEventListener('change',()=>renderLot(excl));
  renderLot(excl);
}
/* ยอดหนี้คงเหลือ */
function initDebt(p,t){
  const cfg=DEBT[p.cat];if(!cfg)return;
  const sel=$('#f_party'),ct=$('#f_ctype'),hint=$('#debtHint'),am=$('#f_amount');if(!sel||!hint)return;
  const upd=()=>{
    const pid=sel.value;if(!pid||pid==='__new'){hint.innerHTML='';return}
    let acc=cfg.acc||(ct?ct.value:'2100'),bal=partyBalance(pid,acc,t&&t.id),others='';
    if(!cfg.acc){
      const ob=['2100','2200','2300','2400'].filter(x=>x!==acc).map(x=>[x,partyBalance(pid,x,t&&t.id)]).filter(x=>x[1]>0.004);
      if(bal<=0.004&&ob.length===1&&ct){ct.value=ob[0][0];acc=ob[0][0];bal=ob[0][1];}
      else if(ob.length)others=' · ยังค้างประเภทอื่น: '+ob.map(x=>esc(ACC[x[0]].n)+' '+esc(fmt(x[1]))).join(', ');
    }
    const a=parseFloat(am.value)||0;
    hint.innerHTML=bal>0.004?`${esc(cfg.w)}: <b>${esc(fmt(bal))}</b> บาท <button type="button" class="btn sm" data-a="fill" data-t="f_amount" data-v="${bal}" style="margin-left:6px">${esc(cfg.btn)}</button>${others}${a>bal+0.004?'<div class="err">จำนวนเงินมากกว่ายอดที่ค้างอยู่</div>':''}`:`${esc(cfg.w)}: ไม่มียอดค้าง${others}`;
  };
  sel.addEventListener('change',upd);if(ct)ct.addEventListener('change',upd);am.addEventListener('input',upd);upd();
}
function initDispose(t){
  const as=$('#f_asset'),dt=$('#f_date'),am=$('#f_amount'),h=$('#dispHint');
  const upd=()=>{
    const a=assetList().find(x=>x.id===as.value);if(!a||!dt.value){h.textContent='';return}
    if(dt.value<a.date){h.innerHTML='<span class="err">วันที่จำหน่ายต้องไม่ก่อนวันที่ได้สินทรัพย์มา</span>';return}
    const c=disposeCalcFor(a,dt.value,parseFloat(am.value)||0);
    h.innerHTML='ราคาทุน '+esc(fmt(a.cost))+' · ค่าเสื่อมสะสมถึงวันที่จำหน่าย '+esc(fmt(r2(c.prior+c.fin),'0.00'))+' · มูลค่าตามบัญชี <b>'+esc(fmt(c.bv,'0.00'))+'</b> บาท'+(c.gain>0?' · <b style="color:var(--in)">กำไร '+esc(fmt(c.gain))+'</b>':c.loss>0?' · <b class="neg">ขาดทุน '+esc(fmt(c.loss))+'</b>':'');
  };
  [as,dt,am].forEach(e=>e.addEventListener('input',upd));as.addEventListener('change',upd);upd();
}
function formAfter(p,t){
  const ps=$('#f_party'),is=$('#f_item');
  if(ps)ps.addEventListener('change',()=>{$('#newParty').hidden=ps.value!=='__new'});
  if(is)is.addEventListener('change',()=>{
    $('#newItem').hidden=is.value!=='__new';
    const it=iget(is.value),q=$('#f_qty'),pr=$('#f_price'),am=$('#f_amount');
    const qLabel=q&&q.parentElement.querySelector('label');if(qLabel&&it)qLabel.textContent='จำนวน ('+it.unit+')';
    if(it&&pr&&am&&['sale','buy_goods','credit_sale','credit_buy_goods'].includes(p.cat)){if(it.price>0){pr.value=it.price;if(q&&parseFloat(q.value)>0)am.value=r2(parseFloat(q.value)*it.price)}else if(q&&parseFloat(q.value)>0&&parseFloat(am.value)>0)pr.value=pround(parseFloat(am.value)/parseFloat(q.value));}
  });
  const newPrice=$('#f_iprice');if(newPrice)newPrice.addEventListener('input',()=>{const pr=$('#f_price'),q=$('#f_qty'),am=$('#f_amount'),pv=parseFloat(newPrice.value),qv=q?parseFloat(q.value):0;if(pr&&am&&pv>=0&&newPrice.value!==''){pr.value=pv;if(qv>0)am.value=r2(qv*pv)}});
  const am=$('#f_amount'),pr=$('#f_price'),qe=$('#f_qty')||$('#f_pcs');
  if(pr&&am&&qe){
    const q=()=>parseFloat(qe.value),pp=()=>parseFloat(pr.value),a=()=>parseFloat(am.value);
    qe.addEventListener('input',()=>{if(q()>0&&pp()>=0&&pr.value!=='')am.value=r2(q()*pp());else if(q()>0&&a()>0)pr.value=pround(a()/q())});
    pr.addEventListener('input',()=>{if(q()>0&&pp()>=0&&pr.value!=='')am.value=r2(q()*pp())});
    am.addEventListener('input',()=>{if(q()>0&&a()>0)pr.value=pround(a()/q())});
  }
  if($('#linesBox'))initLines(t);
  if($('#f_from'))initLot(t);
  initDebt(p,t);
  if($('#dispHint'))initDispose(t);
  if(am&&!t&&!qe&&!$('#linesBox')&&!$('#f_asset'))setTimeout(()=>{try{am.focus()}catch(e){}},50);
}

const num=id=>{const e=$('#'+id);return e?parseFloat(e.value):NaN};

function saveTx(p){
  const d=CD[p.cat],err=[];const o={};const old=p.id?S.tx.find(x=>x.id===p.id):null;
  let np=null,ni=null,lineTotal=null;const nis=[];
  for(const spec of d.f){
    const f=parseF(spec);
    if(f.nm==='date'){o.date=val('f_date');if(!o.date)err.push('กรุณาเลือกวันที่')}
    else if(f.nm==='amount'){o.amount=num('f_amount');if(!(o.amount>0)&&!d.f.some(s=>s.startsWith('lines:')))err.push('กรุณาใส่จำนวนเงินที่มากกว่า 0')}
    else if(f.nm==='amount0'){o.amount=num('f_amount');if(isNaN(o.amount))o.amount=0;if(o.amount<0)err.push('จำนวนเงินต้องไม่ติดลบ')}
    else if(f.nm==='price'){}
    else if(f.nm==='pcs'){o.pcs=num('f_pcs');if(!(o.pcs>=1))err.push('กรุณาใส่จำนวนชิ้นอย่างน้อย 1')}
    else if(f.nm==='salvage'){o.salvage=num('f_salv')||0;if(o.salvage<0)err.push('มูลค่าซากต้องไม่ติดลบ')}
    else if(f.nm==='asset'){o.assetId=val('f_asset');if(!o.assetId)err.push('กรุณาเลือกสินทรัพย์ที่จำหน่าย')}
    else if(f.nm==='recv'){o.recv=val('f_recv')}
    else if(f.nm==='range'){o.from=val('f_from');o.to=val('f_to');if(!o.from||!o.to)err.push('กรุณาเลือกช่วงวันที่ผลิต');else if(o.from>o.to)err.push('วันที่เริ่มผลิตต้องไม่หลังวันที่สิ้นสุด')}
    else if(f.nm==='lines'||f.nm==='linesq'){
      const priced=f.nm==='lines',L=[];
      readLn().forEach((r,i)=>{
        if(!r.itemId&&!(r.q>0)&&!(r.a>0))return;
        const no='รายการที่ '+(i+1)+': ';let itemId=r.itemId;
        if(itemId==='__new'){if(!r.nn){err.push(no+'กรุณาพิมพ์ชื่อวัตถุดิบ');return}const x={id:uid(),kind:f.label,name:r.nn,unit:r.nu||'หน่วย',cost:0,price:0};nis.push(x);itemId=x.id}
        if(itemId&&!(r.q>0)){err.push(no+'กรุณาใส่จำนวน');return}
        if(!itemId){if(!priced){err.push(no+'กรุณาเลือกวัตถุดิบ');return}if(!(r.a>0)){err.push(no+'เลือกวัตถุดิบหรือใส่จำนวนเงิน');return}}
        if(priced&&!(r.a>0)){err.push(no+'กรุณาใส่ราคาต่อหน่วยหรือจำนวนเงิน');return}
        L.push({itemId:itemId||'',qty:itemId?r.q:0,price:r.p||0,amount:priced?r2(r.a):0,desc:r.desc||''});
      });
      if(!L.length&&!err.length)err.push('กรุณาใส่อย่างน้อย 1 รายการ');
      o.lines=L;if(priced)lineTotal=r2(L.reduce((s,l)=>s+l.amount,0));
    }
    else if(f.nm==='desc'){o.desc=val('f_desc');if(f.req&&!o.desc)err.push('กรุณาพิมพ์'+(f.label||'รายละเอียด'))}
    else if(f.nm==='qty'){o.qty=num('f_qty');if(isNaN(o.qty))o.qty=0;if(f.req&&!(o.qty>0))err.push('กรุณาใส่จำนวน')}
    else if(f.nm==='party'){const s=val('f_party');if(s==='__new'){const n=val('f_pname');if(!n)err.push('กรุณาพิมพ์ชื่อ');else np={id:uid(),type:f.ty,name:n,no:val('f_pno'),addr:val('f_paddr'),idc:val('f_pid')}}else if(s)o.partyId=s;else if(f.req)err.push('กรุณาเลือกชื่อ')}
    else if(f.nm==='item'){const s=val('f_item');if(s==='__new'){const n=val('f_iname');if(!n)err.push('กรุณาพิมพ์ชื่อ'+(f.ty==='goods'?'สินค้า':'วัตถุดิบ'));else ni={id:uid(),kind:f.ty,name:n,unit:val('f_iunit')||'หน่วย',cost:0,price:num('f_iprice')||0}}else if(s)o.itemId=s;else if(f.req)err.push('กรุณาเลือก'+(f.ty==='goods'?'สินค้า':'วัตถุดิบ'))}
    else if(f.nm==='ctype')o.ctype=val('f_ctype');
    else if(f.nm==='sub')o.sub=val('f_sub');
    else if(f.nm==='life'){o.life=num('f_life');if(!(o.life>=1))err.push('กรุณาใส่อายุการใช้งานอย่างน้อย 1 ปี')}
    else if(f.nm==='accum'){o.accum=num('f_accum')||0;if(o.accum>(o.amount||0))err.push('ค่าเสื่อมสะสมต้องไม่เกินราคาทุน')}
    else if(f.nm==='dr'||f.nm==='cr'){o[f.nm]=val('f_'+f.nm);if(!o[f.nm])err.push('กรุณาเลือกบัญชี'+(f.nm==='dr'?'ด้านเดบิต':'ด้านเครดิต'))}
  }
  if(lineTotal!==null)o.amount=lineTotal;
  if(o.salvage>0&&o.amount>0&&o.salvage>=o.amount)err.push('มูลค่าซากต้องน้อยกว่าราคาทุน');
  if(p.cat==='dispose_asset'){
    const as=assetList().find(x=>x.id===o.assetId);
    if(o.assetId&&!as)err.push('ไม่พบสินทรัพย์นี้');
    else if(as&&o.date<as.date)err.push('วันที่จำหน่ายต้องไม่ก่อนวันที่ได้สินทรัพย์มา ('+dshort(as.date)+')');
    else if(as&&as.dispId&&as.dispId!==(old&&old.id))err.push('สินทรัพย์นี้จำหน่ายไปแล้ว');
    if(o.recv==='none'&&o.amount>0)err.push('ถ้ามีเงินที่ได้รับ ให้เลือกรับเข้าเงินสดหรือเงินฝากธนาคาร');
    if(o.recv!=='none'&&!(o.amount>0))err.push('ถ้าไม่ได้รับเงิน ให้เลือก "ไม่ได้รับเงิน"');
  }
  if(o.dr&&o.dr===o.cr)err.push('บัญชีเดบิตและเครดิตต้องไม่ซ้ำกัน');
  if((o.itemId||ni)&&!(o.qty>0)&&d.f.some(s=>parseF(s).nm==='qty'))err.push('เลือกสินค้า/วัตถุดิบแล้ว กรุณาใส่จำนวนด้วย');
  if(err.length){$('#f_err').innerHTML=err.map(esc).join('<br>');$('#f_err').scrollIntoView({block:'center'});return}
  if(np){S.parties.push(np);o.partyId=np.id}
  nis.forEach(x=>S.items.push(x));
  if(ni){S.items.push(ni);o.itemId=ni.id}
  if(o.amount==null)o.amount=0;
  let kind=d.k==='open'||d.k==='gen'?'gen':d.k,acct=(kind==='in'||kind==='out')?p.acct:null;
  if(p.cat==='dispose_asset'){kind=o.recv==='none'?'gen':'in';acct=o.recv==='none'?null:o.recv;delete o.recv}
  const t=Object.assign({id:old?old.id:uid(),n:old?old.n:S.seq++,kind,cat:p.cat,acct},o);
  if(old)S.tx[S.tx.indexOf(old)]=t;else S.tx.push(t);
  if(t.lines)for(const l of t.lines){const it=iget(l.itemId);if(it&&l.price>0){it.price=l.price;if(p.cat==='buy_raw'||p.cat==='credit_buy_raw'||p.cat==='prod_exp')it.cost=l.price;}}
  if(['sale','buy_goods','credit_sale','credit_buy_goods'].includes(p.cat)&&t.itemId&&t.qty>0&&t.amount>0){const it=iget(t.itemId);if(it)it.price=r2(t.amount/t.qty);}
  S.ui.lastDate=o.date;S.ui.year=+o.date.slice(0,4);
  commit();
  nav.pop();nav.push({s:'done',p:{id:t.id,cat:p.cat,acct:t.acct||p.acct,edited:!!old}});render();
}

function monthlyChart(y){
  const vals=Array.from({length:12},(_,i)=>{const st=mSt(y,i+1),en=mEn(y,i+1);let inc=0,exp=0;for(const e of E()){if(e.date<st||e.date>en)continue;for(const l of e.lines){const ty=ACC[l.acc]?.t;if(ty==='R')inc+=l.cr-l.dr;else if(ty==='X')exp+=l.dr-l.cr}}return{m:MS[i],inc:Math.max(0,r2(inc)),exp:Math.max(0,r2(exp))}});
  const max=Math.max(1,...vals.flatMap(v=>[v.inc,v.exp]));
  return `<div class="sect"><h3>แผนภูมิแท่งเปรียบเทียบรายได้และรายจ่ายรายเดือน</h3><div class="card"><p class="hint">ปี พ.ศ. ${y+543} · คำนวณจากบัญชีรายได้และค่าใช้จ่ายที่บันทึกไว้</p><div class="chart-legend"><span><i class="chart-dot"></i>รายได้</span><span><i class="chart-dot exp"></i>รายจ่าย</span></div><div class="chart-grid">${vals.map(v=>`<div class="chart-month"><div class="chart-bars" title="${v.m}: รายได้ ${fmt(v.inc)} บาท · รายจ่าย ${fmt(v.exp)} บาท"><div class="chart-bar" style="height:${Math.max(v.inc?2:0,v.inc/max*100)}%" aria-label="รายได้ ${fmt(v.inc)} บาท"></div><div class="chart-bar exp" style="height:${Math.max(v.exp?2:0,v.exp/max*100)}%" aria-label="รายจ่าย ${fmt(v.exp)} บาท"></div></div><div style="margin-top:5px">${v.m}</div><div style="font-size:.7rem">${fmt(v.inc, '0')} / ${fmt(v.exp,'0')}</div></div>`).join('')}</div><p class="hint">ตัวเลขใต้แต่ละเดือนแสดง รายได้ / รายจ่าย (บาท) · เลื่อนตารางกราฟในแนวนอนได้</p></div></div>`;
}

    const rcols=[{t:'วันที่',d:1},{t:'รายการ'},...rc,{t:'รวมรับ',n:1}];
    const rfoot=['รวม','',...RC.map(c=>r2(B.recv.filter(r=>r.col===c[0]).reduce((s,r)=>s+r.amt,0))),B.tr];
    const lblP=c=>c==='XF'?(acct==='cash'?'นำฝาก':'ถอนเงิน'):null;
    const pcols=[{t:'วันที่',d:1},{t:'รายการ'},...PC.map(c=>({t:lblP(c[0])||c[1],n:1,grp:c[2]})),{t:'รวมจ่าย',n:1}];
    const payRows=B.pay.sort(cmp3).map(r=>({c:[dshort(r.date),txDesc(r.t),...PC.map(c=>r.col===c[0]?r.amt:null),r.amt],act:ed(r.t)}));
    const pfoot=['รวม','',...PC.map(c=>r2(B.pay.filter(r=>r.col===c[0]).reduce((s,r)=>s+r.amt,0))),B.tp];

  }else{
    let bal=B.carry;const rows=[{c:['','ยอดยกมา','','',bal],cls:'tot'}];
    const all=[...B.recv.map(r=>({...r,s:1})),...B.pay.map(r=>({...r,s:-1}))].sort(cmp3);
    for(const r of all){bal=r2(bal+r.s*r.amt);rows.push({c:[dshort(r.date),txDesc(r.t),r.s>0?r.amt:null,r.s<0?r.amt:null,bal],act:ed(r.t)})}
    view=tbl([{t:'วันที่',d:1},{t:'รายการ'},{t:'รับ',n:1},{t:'จ่าย',n:1},{t:'คงเหลือ',n:1}],rows,['รวม','',B.tr,B.tp,B.end]);
  }

  <div class="kpis">${kpi('ยกมา',B.carry)}${kpi('รวมรับ',B.tr)}${kpi('รวมจ่าย',B.tp)}${kpi((acct==='cash'?'เงินสด':'เงินฝาก')+'คงเหลือ',B.end,1)}</div>
  ${view}
  <p class="hint">แตะที่แถวเพื่อแก้ไขหรือลบรายการ · ตารางกว้างเลื่อนดูไปทางขวาได้</p>

};
const cmp3=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t.n||0)-(b.t.n||0);

SCR.gjournal=()=>{
  const y=S.ui.year,m=S.ui.m|0,st=mSt(y,m),en=mEn(y,m),jt=S.ui.jt||'journal';

  if(jt==='journal'){
    const rows=[];
    for(const e of E()){if(e.src!=='gen'&&e.src!=='adj')continue;if(e.date<st||e.date>en)continue;
      rows.push({c:[dshort(e.date),{h:'<b>'+esc(e.desc)+'</b>'},'',''],act:e.tx?['go',{s:'form',p:{cat:e.tx.cat,id:e.tx.id}}]:null,cls:''});
      for(const l of e.lines)rows.push([ '',{h:'<span style="padding-left:'+(l.dr?'0':'22px')+'">'+esc(ACC[l.acc].n)+(l.party?' ('+esc(pname(l.party))+')':'')+'</span>'},l.dr||null,l.cr||null]);
    }
    view=tbl([{t:'วันที่',d:1},{t:'รายการ'},{t:'เดบิต',n:1},{t:'เครดิต',n:1}],rows);

    L.sort((a,b)=>cmp2(a.t,b.t));
    const rows=L.map(r=>({c:[dshort(r.t.date),txDesc(r.t),...cats.map(c=>c===r.col?+r.t.amount:null)],act:['go',{s:'form',p:{cat:r.t.cat,acct:r.t.acct,id:r.t.id}}]}));
    const foot=['รวม','',...cats.map(c=>r2(L.filter(r=>r.col===c).reduce((s,r)=>s+ +r.t.amount,0)))];

function assetRow(a,y){
  const sc=depSchedule(a,maxYear()),cur=sc.find(s=>s.y===y),acc=r2(a.accum+sc.filter(s=>s.y<=y).reduce((s,x)=>s+x.amt,0));
  return{a,dep:cur?cur.amt:0,acc,net:r2(a.cost-acc),unit:r2(a.cost/(a.pcs||1))};
}
/* สินทรัพย์ที่ยังใช้งาน ณ สิ้นปี y และที่จำหน่ายในปี y */
function assetsAt(y){
  const act=[],gone=[];
  for(const a of assetList()){
    if(+a.date.slice(0,4)>y)continue;
    const dy=a.disp?+a.disp.slice(0,4):null;
    if(dy!==null&&dy<y)continue;
    if(dy===y)gone.push(assetRow(a,y));else act.push(assetRow(a,y));
  }
  return{act,gone};
}
SCR.assets=()=>{
  const y=S.ui.year,{act,gone}=assetsAt(y);
  const edit=a=>{const x=S.tx.find(q=>q.id===a.id);return['go',{s:'form',p:{cat:x.cat,acct:x.acct||'cash',id:x.id}}]};
  const rows=act.map(r=>({c:[r.a.name,dshort(r.a.acq),r.a.pcs,r.unit,r.a.life,r.a.cost,r.a.salvage,r.dep,r.acc,r.net],act:edit(r.a)}));
  const tot=k=>r2(act.reduce((s,r)=>s+(+r.c?0:0),0));
  const sm=f=>r2(act.reduce((s,r)=>s+f(r),0));
  const grows=gone.map(r=>{const x=S.tx.find(q=>q.id===r.a.dispId),c=disposeCalcFor(r.a,x.date,x.amount),gl=r2(c.gain-c.loss);

function prodCostData(f,t){
  const y=+t.slice(0,4),c=t===yEn(y)?(S.closing[y]||{}):{};

  const fr=S.tx.filter(x=>x.cat==='freight_in'&&inR(x)).sort(cmp2);
  const pe=S.tx.filter(x=>x.cat==='prod_exp'&&inR(x)).sort(cmp2);
  const sumA=l=>r2(l.reduce((s,x)=>s+ +x.amount,0));
  const lab=pe.filter(x=>x.sub==='labor'),ot=pe.filter(x=>x.sub!=='labor');
  const buyT=sumA(buys),frT=sumA(fr),tot=r2(rawOpen+buyT+frT),used=r2(tot-rawClose),labT=sumA(lab),otT=sumA(ot),cost=r2(used+labT+otT);
  const units=+c.units||0;
  const bl=[];
  for(const x of buys){
    const base=x.desc||'ซื้อวัตถุดิบ';
    if(x.lines&&x.lines.length)x.lines.forEach(l=>{const it=iget(l.itemId);bl.push({k:'sub',t:'   '+base+(it&&l.qty?' — '+it.name+' '+fq(l.qty)+' '+it.unit+' @ '+fmt(l.amount/l.qty):''),a:+l.amount})});
    else{const it=iget(x.itemId);bl.push({k:'sub',t:'   '+base+(it&&x.qty?' ('+fq(x.qty)+' '+it.unit+' @ '+fmt(x.amount/x.qty)+')':''),a:+x.amount})}
  }
  const rows=[{k:'head',t:'วัตถุดิบ'},{k:'sub',t:'วัตถุดิบคงเหลือต้นงวด',a:rawOpen},{k:'sub',t:'บวก ซื้อวัตถุดิบ'},...bl,{k:'sub',t:'รวมซื้อวัตถุดิบ',a:buyT},
   {k:'sub',t:'บวก ค่าขนส่งซื้อวัตถุดิบ (ขนส่งขาเข้า)'},...fr.map(x=>({k:'sub',t:'   '+(x.desc||'ค่าขนส่งซื้อวัตถุดิบ'),a:+x.amount})),{k:'sub',t:'รวมค่าขนส่งขาเข้า',a:frT},{k:'tot',t:'รวมวัตถุดิบ',b:tot},
   {k:'sub',t:'หัก วัตถุดิบคงเหลือสิ้นงวด',a:-rawClose},{k:'tot',t:'วัตถุดิบใช้ไป',b:used},
   {k:'head',t:'ค่าแรงงาน'},...lab.map(x=>({k:'sub',t:x.desc||'ค่าแรงงาน',a:+x.amount})),{k:'tot',t:'รวมค่าแรงงาน',b:labT},
   {k:'head',t:'ค่าใช้จ่ายในการผลิต'},...ot.map(x=>({k:'sub',t:x.desc||'ค่าใช้จ่ายในการผลิต',a:+x.amount})),{k:'tot',t:'รวมค่าใช้จ่ายในการผลิต',b:otT},
   {k:'grand',t:'ต้นทุนการผลิต',b:cost},{k:'sub',t:'จำนวนหน่วยที่ผลิตได้'+(c.uname?' ('+c.uname+')':''),a:units||null},{k:'grand',t:'ต้นทุนการผลิตต่อหน่วย',b:units?r2(cost/units):0}];
  return{rows,cost,units,closed:t===yEn(y)&&!!S.closing[y]};
}

  return{title:'ส่งออก Excel พร้อมพิมพ์',sub:'เลือกช่วงเวลาและรายงาน',year:true,html:`
  <p class="sub">ไฟล์ที่ได้ตั้งหน้ากระดาษ A4 ไว้แล้ว มีชื่อกลุ่มและชื่อรายงานเป็นหัวกระดาษ เลขหน้าท้ายกระดาษ และหัวตารางซ้ำทุกหน้า เปิดใน Excel แล้วสั่งพิมพ์ได้เลย</p>
  <div class="card sect"><h3>ช่วงเวลา (ปีตามที่เลือกด้านบน)</h3>
   <div class="tabs">${Q.map(([l,a,b])=>`<button class="tab" data-a="xrange" data-f="${mSt(y,a)}" data-t="${mEn(y,b)}" aria-pressed="${f===mSt(y,a)&&t===mEn(y,b)}">${esc(l)}</button>`).join('')}</div>
   <div class="field"><label for="x_mon">หรือเลือกทีละเดือน</label><select id="x_mon"><option value="">— เลือกเดือน —</option>${MF.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></div>
   <div class="form two"><div class="field"><label for="x_from">ตั้งแต่วันที่</label><input type="date" id="x_from" value="${esc(f)}"></div><div class="field"><label for="x_to">ถึงวันที่</label><input type="date" id="x_to" value="${esc(t)}"></div></div></div>
  <div class="card sect"><h3>รายงานที่ต้องการ</h3>
   <div class="row"><button class="btn ghost sm" data-a="xall" data-v="1">เลือกทั้งหมด</button><button class="btn ghost sm" data-a="xall" data-v="0">ไม่เลือกเลย</button></div>
   <div class="grid">${XSHEETS.map(([k,l])=>`<label class="row" style="gap:10px;min-height:40px;flex-wrap:nowrap"><input type="checkbox" class="xs" data-k="${k}" ${xs[k]===false?'':'checked'} style="width:22px;height:22px;flex:none"><span>${esc(l)}</span></label>`).join('')}</div></div>
  <p class="hint">งบทดลองและงบแสดงฐานะการเงินแสดง ณ วันที่สิ้นสุดของช่วง · ถ้าช่วงที่เลือกไม่ถึงสิ้นปี สินค้า/วัตถุดิบคงเหลือและค่าเสื่อมราคาจะยังไม่นับ (บันทึกตอนปิดงวดสิ้นปี)</p>`,
  bar:`<button class="btn block" data-a="exportX">สร้างไฟล์ Excel</button>`,
  after:()=>{loadXL().catch(()=>{})}};
};
async function exportX(el){
  const f=($('#x_from')||{}).value||S.ui.xf,t=($('#x_to')||{}).value||S.ui.xt;
  if(!f||!t||f>t){toast('เลือกช่วงวันที่ให้ถูกต้อง');return}
  const keys=XSHEETS.map(s=>s[0]).filter(k=>(S.ui.xs||{})[k]!==false);
  if(!keys.length){toast('เลือกอย่างน้อย 1 รายงาน');return}
  const old=el?el.textContent:'';if(el){el.disabled=true;el.textContent='กำลังสร้างไฟล์...'}
  try{await exportExcel(f,t,keys)}
  catch(e){toast(e&&e.message==='load'?'ยังโหลดตัวสร้างไฟล์ Excel ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่':'สร้างไฟล์ไม่สำเร็จ')}
  finally{if(el){el.disabled=false;el.textContent=old}}
}
async function backup(){
  const json=JSON.stringify(S);
  const ok=await saveFile('สำรองข้อมูลบัญชี-'+todayISO()+'.json',json);
  if(!ok){const b=$('#bkText');if(b)b.innerHTML=`<div class="field"><label for="bkArea">คัดลอกข้อความนี้เก็บไว้ (เก็บเป็นไฟล์ .json ได้)</label><textarea id="bkArea" rows="4" readonly>${esc(json)}</textarea></div>`}
}

/* ---------- การกระทำ ---------- */
const ACT={
  go(el,p){nav.push({s:el.dataset.s||p.s,p:p.p||(el.dataset.s?p:{})});render()},
  back,home:toHome,
  again(el,p){nav.pop();nav.push({s:'form',p:{cat:p.cat,acct:p.acct}});render()},
  saveOrg(){
    const n=val('o_name');if(!n){$('#o_err').textContent='กรุณาพิมพ์ชื่อวิสาหกิจชุมชน';$('#o_name').focus();return}
    const needsAccess=!(S.auth&&S.auth.password),pw=val('o_pass'),pw2=val('o_pass2');
    if(needsAccess){if(pw.length<4){$('#o_err').textContent='กรุณาตั้งรหัสผ่านอย่างน้อย 4 ตัวอักษร';$('#o_pass').focus();return}if(pw!==pw2){$('#o_err').textContent='รหัสผ่านทั้งสองช่องไม่ตรงกัน';$('#o_pass2').focus();return}}
    const yb=parseInt(val('o_year'));
    Object.assign(S.org,{name:n,kind:val('o_kind'),regno:val('o_reg'),address:val('o_addr'),phone:val('o_tel'),president:val('o_pres'),bookkeeper:val('o_book'),startYear:(yb>2400?yb-543:yb)||thisYear()});
    const first=!S.setup||needsAccess;S.setup=true;if(first){S.auth=S.auth||{};S.auth.password=pw;unlocked=true;S.ui.year=thisYear();commit();nav=[{s:'shareSetup',p:{}}];toast('บันทึกข้อมูลแล้ว เพิ่มรายชื่อหุ้นส่วนได้หรือกดข้าม');render()}else{commit();toast('บันทึกข้อมูลแล้ว');back()}
  },
  loginIn(){const pw=val('login_pass');if(pw&&S.auth&&pw===S.auth.password){unlocked=true;nav=[{s:'home',p:{}}];render()}else{const e=$('#login_err');if(e)e.textContent='รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง';const i=$('#login_pass');if(i){i.value='';i.focus()}}},
  addShareRow(){const box=$('#shareRows');if(box){const i=box.querySelectorAll('.share-row').length;box.insertAdjacentHTML('beforeend',shareRowHTML(i));}},
  removeShareRow(el){const row=el.closest('.share-row');if(row)row.remove();},
  saveShareSetup(){const rows=[...document.querySelectorAll('.share-row')];for(const row of rows){const name=row.querySelector('.sh_name').value.trim();if(!name)continue;const no=row.querySelector('.sh_no').value.trim(),amount=parseFloat(row.querySelector('.sh_amount').value)||0,phone=row.querySelector('.sh_phone').value.trim(),addr=row.querySelector('.sh_addr').value.trim(),idc=row.querySelector('.sh_idc').value.trim();const existing=S.parties.find(x=>x.type==='member'&&((no&&x.no===no)||(!no&&x.name===name)));if(existing)Object.assign(existing,{name,no,capitalShare:amount,phone,addr,idc});else S.parties.push({id:uid(),type:'member',name,no,capitalShare:amount,phone,addr,idc});}S.ui.shareSetupDone=true;commit();nav=[{s:'home',p:{}}];unlocked=true;render();toast('บันทึกรายชื่อหุ้นส่วนแล้ว');},
  skipShareSetup(){S.ui.shareSetupDone=true;commit();nav=[{s:'home',p:{}}];unlocked=true;render();toast('ข้ามการลงชื่อหุ้นส่วนแล้ว');},
  loadDemo(){loadDemo()},
  clearDemo(el){if(!el.dataset.c){el.dataset.c=1;el.textContent='แตะอีกครั้งเพื่อยืนยันการลบตัวอย่าง';return}S=blank();commit();nav=[{s:'setup',p:{}}];render()},
  resetAll(el){if(!el.dataset.c){el.dataset.c=1;el.textContent='แตะอีกครั้งเพื่อยืนยันลบทั้งหมด';return}S=blank();commit();nav=[{s:'setup',p:{}}];render();toast('ลบข้อมูลทั้งหมดแล้ว')},
  saveTx(el,p){saveTx(p)},
  delTx(el){const dt=S.tx.find(x=>x.id===el.dataset.id);if(dt&&(dt.cat==='buy_asset'||dt.cat==='open_asset')&&S.tx.some(x=>x.cat==='dispose_asset'&&x.assetId===dt.id)){$('#f_err').textContent='ลบไม่ได้ เพราะสินทรัพย์นี้มีรายการจำหน่ายอยู่ ลบรายการจำหน่ายก่อน';return}if(!el.dataset.c){el.dataset.c=1;el.textContent='แตะอีกครั้งเพื่อยืนยันการลบ';return}S.tx=S.tx.filter(t=>t.id!==el.dataset.id);commit();toast('ลบรายการแล้ว');back()},
  saveClosing(){const g=val('c_goods'),m=val('c_mat'),u=num('c_units');S.closing[S.ui.year]={goods:g===''?'':+g,material:m===''?'':+m,units:isNaN(u)?'':u,uname:val('c_uname')};commit();toast('บันทึกการปิดงวดแล้ว');back()},
  fill(el,p,ev){ev.preventDefault();const i=$('#'+el.dataset.t);if(i){i.value=el.dataset.v;i.dispatchEvent(new Event('input',{bubbles:true}))}},
  addLine(){const r=keepRows();r.push({itemId:'',qs:'',ps:'',as:''});drawLines(r)},
  delLine(el){const r=keepRows();r.splice(+el.dataset.i,1);drawLines(r.length?r:[{itemId:'',qs:'',ps:'',as:''}])},
  tab(el,p){const k=el.dataset.k||p.k,v=el.dataset.v??p.v;S.ui[k]=v;persist();if(p.open){nav.push({s:p.open,p:{}})}render()},
  selParty(el,p){S.ui.pid=S.ui.pid||{};S.ui.pid[p.ty]=p.id;persist();render()},
  saveParty(el){const x=S.parties.find(q=>q.id===el.dataset.id),n=val('e_name');if(!n){$('#f_err').textContent='กรุณาพิมพ์ชื่อ';return}x.name=n;if($('#e_no'))x.no=val('e_no');x.idc=val('e_idc');x.addr=val('e_addr');commit();toast('บันทึกแล้ว');back()},
  delParty(el){const id=el.dataset.id;if(S.tx.some(t=>t.partyId===id)){$('#f_err').textContent='ลบไม่ได้ เพราะมีรายการที่ใช้ชื่อนี้อยู่ ลบรายการเหล่านั้นก่อน';return}if(!el.dataset.c){el.dataset.c=1;el.textContent='แตะอีกครั้งเพื่อยืนยัน';return}S.parties=S.parties.filter(x=>x.id!==id);commit();back()},
  saveItem(el){const x=iget(el.dataset.id),n=val('e_name');if(!n){$('#f_err').textContent='กรุณาพิมพ์ชื่อ';return}x.name=n;x.unit=val('e_unit')||'หน่วย';x.price=num('e_price')||0;commit();toast('บันทึกแล้ว');back()},
  delItem(el){const id=el.dataset.id;if(S.tx.some(t=>t.itemId===id)){$('#f_err').textContent='ลบไม่ได้ เพราะมีรายการที่ใช้สินค้านี้อยู่';return}if(!el.dataset.c){el.dataset.c=1;el.textContent='แตะอีกครั้งเพื่อยืนยัน';return}S.items=S.items.filter(x=>x.id!==id);commit();back()},
  backup,exportX,printPage(){window.print()},
  xrange(el){S.ui.xf=el.dataset.f;S.ui.xt=el.dataset.t;persist();render()},
  xall(el){const v=el.dataset.v==='1';S.ui.xs={};XSHEETS.forEach(s=>{S.ui.xs[s[0]]=v});persist();render()},
  doRestore(){S=Object.assign(blank(),pendingRestore);migrate();pendingRestore=null;commit();nav=[{s:'home',p:{}}];render();toast('นำเข้าข้อมูลแล้ว')},
  cancelRestore(){pendingRestore=null;render()}
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const fn=ACT[el.dataset.a];if(!fn)return;
  let p={};try{if(el.dataset.p)p=JSON.parse(el.dataset.p)}catch(e){}
  fn(el,p,ev);
});
document.addEventListener('change',ev=>{
  const id=ev.target.id;
  if(id==='yearSel'){S.ui.year=+ev.target.value;delete S.ui.xf;delete S.ui.xt;persist();render()}
  else if(id==='x_from'||id==='x_to'){S.ui[id==='x_from'?'xf':'xt']=ev.target.value;persist();render()}
  else if(id==='x_mon'){const m=+ev.target.value;if(m){S.ui.xf=mSt(S.ui.year,m);S.ui.xt=mEn(S.ui.year,m);persist();render()}}
  else if(ev.target.classList&&ev.target.classList.contains('xs')){S.ui.xs=S.ui.xs||{};S.ui.xs[ev.target.dataset.k]=ev.target.checked;persist()}
  else if(id==='monSel'){S.ui.m=+ev.target.value;persist();render()}
  else if(id==='accSel'){S.ui.acc=ev.target.value;persist();render()}
  else if(id==='itemSel'){const c=nav[nav.length-1];S.ui.sid=S.ui.sid||{};S.ui.sid[c.p.kind]=ev.target.value;persist();render()}
});
(async()=>{
  load();
  try{const c=window.claude;if(c&&c.use)dlCap=await c.use('downloads')}catch(e){dlCap=null}
})();
load();
nav=[{s:S.setup?(S.auth&&S.auth.password?'login':(S.org.demo?'home':'setup')):'setup',p:{}}];
render();
</script>
